name: Deploy app (ambiente de teste)

# Só manual: o ambiente de teste não recebe deploy a cada push (docs/ambiente-de-teste.md).
on:
  workflow_dispatch:

concurrency: deploy-app

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build + deploy apps/app
    # Accounts moved into Postgres (S11-03): playwright.config.ts's webServer now needs a real,
    # reachable database on 5432 to boot the API at all -- same image/port the local E2E docs
    # (apps/app/README.md) and Api.Tests' Testcontainers fixture already use.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: limmiar_e2e
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: apps/app/public/models/voice-identity
          key: voice-wasm-${{ runner.os }}-${{ hashFiles('tools/voice-identity/Dockerfile', 'tools/voice-identity/CMakeLists.txt', 'tools/voice-identity/embedding.cpp', 'tools/voice-identity/worker.js', 'tools/voice-identity/setup.mjs') }}

      - name: Prepare verified browser voice model and runtime for E2E
        run: node tools/voice-identity/setup.mjs

      - name: E2E (crossOriginIsolated + iframe de terceiro)
        run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app test:e2e

      # Origens do ambiente de teste entram como constante de build e na CSP (apps/app/security-headers.ts).
      # VITE_JUIZ_BASE_URL fica vazia: só o orquestrador chama o juiz.
      - name: Build
        run: |
          test -n "$VITE_API_BASE_URL" && test -n "$VITE_COPILOTO_BASE_URL" && test -n "$VITE_SPEECH_BASE_URL" || { echo 'Defina as variáveis VITE_API_BASE_URL, VITE_COPILOTO_BASE_URL e VITE_SPEECH_BASE_URL do repositório' >&2; exit 1; }
          pnpm --filter app build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COPILOTO_BASE_URL: ${{ vars.VITE_COPILOTO_BASE_URL }}
          VITE_SPEECH_BASE_URL: ${{ vars.VITE_SPEECH_BASE_URL }}
          VITE_JUIZ_BASE_URL: ${{ vars.VITE_JUIZ_BASE_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/app
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
