name: Deploy app to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build + deploy apps/app
    # Accounts moved into Postgres (S11-03): playwright.config.ts's webServer now needs a real,
    # reachable database on 5432 to boot the API at all -- same image/port the local E2E docs
    # (apps/app/README.md) and Api.Tests' Testcontainers fixture already use.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: limmiar_e2e
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E (crossOriginIsolated + iframe de terceiro)
        run: pnpm --filter app exec playwright install --with-deps chromium
      - run: pnpm --filter app test:e2e

      - name: Build
        run: pnpm --filter app build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/app
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
