name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Runs on every push to main AND every PR (not gated to pull_request) —
  # coverage must hold on main too, not just be checked before merge.
  coverage:
    name: "Coverage 100% (Vitest+Istanbul)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          # setup-node resolves '22' to the latest 22.x release, which is
          # already well past 22.12 — the version jsdom's ESM-only CSS deps
          # need unflagged (see vite.config.ts's execArgv comment). Matches
          # deploy.yml's pin.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest exits non-zero when any coverage threshold (perFile 100%) is
      # unmet, so this step's own exit code is the gate — nothing extra to
      # check.
      - name: Unit tests + coverage (app)
        run: pnpm --filter app test:unit

      - name: Unit tests + coverage (i18n)
        run: pnpm --filter i18n test:unit

      - name: Unit tests + coverage (ui)
        run: pnpm --filter ui test:unit

      - name: Unit tests + coverage (crypto)
        run: pnpm --filter crypto test:unit

      - name: Unit tests + coverage (diarization)
        run: pnpm --filter diarization test:unit

      - name: Unit tests + coverage (site)
        run: pnpm --filter site test:unit

  # S00-03 gate: the 7 adaptive primitives × 4 breakpoints (sm/md/lg/xl —
  # Wireframes - Responsivo (3 plataformas).dc.html) must render correctly
  # and stay axe-clean. Playwright Component Testing mounts each primitive
  # in isolation (no app shell needed) at 4 fixed viewport projects defined
  # in packages/ui/playwright-ct.config.ts; a missing/changed baseline
  # screenshot or a new axe violation fails this job. S00.5-04 (pseudo-locale
  # in this same matrix) extends these *.spec.tsx files, not this job.
  visual-regression:
    name: "Visual regression (7 primitivas × 4 breakpoints)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm --filter ui exec playwright install --with-deps chromium

      # playwright exits non-zero on a screenshot mismatch/missing baseline
      # or a failed assertion (axe violations, touch-target size) — that
      # failure is this step's own exit code, nothing extra to check.
      - name: Visual regression + axe + touch targets (ui)
        run: pnpm --filter ui test:visual

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            packages/ui/test-results
            packages/ui/playwright-report

  # Enforces ADR-S00.5-03: no date/number library (date-fns/dayjs/moment) may
  # enter packages/i18n — Intl (backed by the same CLDR data as the plural
  # catalog) is the single source of truth for formatting. Its own step,
  # separate from the coverage job above, since it's a structural check, not
  # a test run. The same rule extends to packages/ui (CalendarViewport
  # formats dates directly), so its own dependency-cruiser config mirrors
  # i18n's here rather than being a special case.
  arch:
    name: "Architecture rules (dependency-cruiser)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency rules (i18n)
        run: pnpm --filter i18n lint:arch

      - name: Dependency rules (ui)
        run: pnpm --filter ui lint:arch

      - name: Dependency rules (crypto)
        run: pnpm --filter crypto lint:arch

      - name: Dependency rules (diarization)
        run: pnpm --filter diarization lint:arch

  # S00.5-03 gate 1: custom ESLint config enforcing i18n-safe source — no
  # hardcoded JSX text outside a translation macro
  # (lingui/no-unlocalized-strings, official @lingui plugin) and no
  # toLocaleDateString/toLocaleTimeString/toLocaleString call without an
  # explicit locale (local rule, unit-tested via eslint-rules/*.test.js).
  # Scoped, separate from oxlint (pnpm --filter app lint) — same precedent as
  # dependency-cruiser coexisting with oxlint in packages/i18n (above) for a
  # rule oxlint has no equivalent/custom-rule API for.
  i18n-lint:
    name: "i18n: lint (hardcoded strings + unlocalized formatting)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (custom ESLint rule)
        run: pnpm --filter app test:eslint-rules

      - name: ESLint (i18n gate)
        run: pnpm --filter app lint:i18n

  # S00.5-03 gate 2: a message added in code without running `lingui
  # extract` first must fail the PR. `lingui extract` only rewrites a
  # catalog file when its content actually changed (deterministic output —
  # verified against @lingui/cli's formatterWrapper source), so running it
  # and then checking for a diff/untracked change on the catalogs is
  # Lingui's own documented CI pattern for this — the CLI has no `--check`
  # flag to do it in one step.
  i18n-extract-check:
    name: "i18n: extract check (message without catalog entry)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract messages
        run: pnpm --filter app check:i18n-extract

      # `git status --porcelain` (not `git diff --exit-code`) on purpose: a
      # brand-new locale catalog would be untracked, not modified, and
      # `git diff` alone never sees untracked files.
      - name: Fail if catalogs changed (message in code without a catalog entry)
        run: |
          if [ -n "$(git status --porcelain -- apps/app/src/locales)" ]; then
            echo "::error::Catalogs changed after 'lingui extract' — a message in code has no catalog entry. Run 'pnpm --filter app check:i18n-extract' locally and commit the result."
            git status --porcelain -- apps/app/src/locales
            git diff -- apps/app/src/locales
            exit 1
          fi

  # S00.5-03 gate 3: none of the 4 real catalogs may have a missing
  # translation for a key that exists in the source catalog — `--strict` is
  # the native Lingui CLI flag for this (fails the process, not just a
  # report).
  i18n-catalog-complete:
    name: "i18n: catalog completeness (compile --strict)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile catalogs (strict — fails on any missing translation)
        run: pnpm --filter app check:i18n-complete

  # S00.5-03 gate 4 / AC4: proves the CI-only pseudo-locale mechanism
  # (ADR-S00.5-06) actually generates a pseudo-LOCALE catalog from the real
  # source catalog at CI build time. lingui.config.pseudo.ts is never read by
  # the production build (@lingui/vite-plugin reads lingui.config.ts) — this
  # job is the only place pseudo-LOCALE is ever compiled, and its output is
  # gitignored (apps/app/.gitignore). Consuming it in the 7-primitives visual
  # regression matrix is ticket S00.5-04, not this one.
  i18n-pseudo-locale:
    name: "i18n: pseudo-locale generation (CI-only)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile pseudo-locale catalog
        run: pnpm --filter app build:i18n-pseudo

      - name: Verify pseudo-locale output (real compiler, no mock)
        run: node apps/app/scripts/verify-pseudo-locale.mjs

  # S00.5-05: proves the Astro public site (apps/site) actually routes by
  # locale (astro:i18n, no i18n library in the bundle — ADR-S00.5-02) with
  # correct hreflang/canonical output. apps/site has no deploy.yml of its own
  # yet to piggyback its E2E run on (unlike apps/app), so this is its own gate
  # — without it, i18n-routing.spec.ts would never run in CI at all.
  site-e2e:
    name: "Astro site: i18n routing E2E (hreflang/canonical)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm --filter site exec playwright install --with-deps chromium

      - name: Build + E2E (site)
        run: pnpm --filter site test:e2e

  # S00-04 gate 1: apps/api is the first .NET code in this monorepo (esqueleto
  # vazio — Solution promised it in S00 but S00-01/02/03 only covered the SPA).
  # Testcontainers.PostgreSql spins up a REAL Postgres container to prove RLS
  # (tenant_isolation policy + FORCE ROW LEVEL SECURITY) actually blocks/allows
  # rows correctly — mocking the database would prove nothing about RLS. The
  # 100% line+branch coverage threshold is enforced as project defaults in
  # tests/Api.Tests/Api.Tests.csproj (not via CLI /p: flags — dotnet test on
  # this SDK mis-splits a comma-separated /p:ThresholdType value passed on the
  # command line), so plain `dotnet test` is enough to fail the step.
  api-tests:
    name: "API: build + tests (Testcontainers Postgres — real, sem mock)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore apps/api/Api.sln

      # ubuntu-latest already has Docker available — Testcontainers needs no
      # extra setup (Ryuk resource reaper works out of the box on this runner).
      - name: Build + test + coverage (api)
        run: dotnet test apps/api/Api.sln -c Release

  # S00-04 gate 2 / AC1: proves apps/api actually publishes as Native AOT with
  # zero reflection at runtime. `dotnet test`/`build`/`run` always JIT, even
  # with PublishAot=true in the csproj — only a real `dotnet publish
  # -p:PublishAot=true` exercises the trim/AOT analyzer for real. The expanded
  # WarningsAsErrors set in Directory.Build.props (IL2026/IL2070/IL3050/etc.)
  # is what makes any trim/reflection regression fail this step, not just warn.
  api-aot-publish:
    name: "API: Native AOT publish (sem reflexão)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (Native AOT, linux-x64)
        run: >
          dotnet publish apps/api/src/Api/Api.csproj -c Release -r linux-x64
          --self-contained -p:PublishAot=true -o apps/api/publish-ci

  # S00.5-06 gate 1 / AC4: the client (apps/app) and the .NET API disagree
  # about the error-response JSON shape unless something proves it on every
  # PR — this regenerates the Pact consumer contract and fails if the
  # committed pacts/*.json drifts, the exact same "regenerate a deterministic
  # artifact, then git-status-check it" pattern as i18n-extract-check above
  # (Pact's own JS library has no `--check` flag either).
  pact-consumer:
    name: "Contract: Pact consumer (client, drift detection)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Pact consumer contract
        run: pnpm --filter app test:pact

      # `git status --porcelain` (not `git diff --exit-code`) for the same
      # reason as i18n-extract-check above: a brand-new contract file would
      # be untracked, not modified.
      - name: Fail if contract changed (consumer expectation not committed)
        run: |
          if [ -n "$(git status --porcelain -- pacts)" ]; then
            echo "::error::pacts/ changed after running the Pact consumer test — a consumer expectation isn't committed. Run 'pnpm --filter app test:pact' locally and commit pacts/limmiar-app-limmiar-api.json."
            git status --porcelain -- pacts
            git diff -- pacts
            exit 1
          fi

  # S00.5-06 gate 2 / AC4: the provider counterpart to pact-consumer above —
  # proves the real .NET API (not a mock) actually satisfies the committed
  # contract. PactNet's verifier issues real HTTP requests over a real
  # socket, so the test this runs boots the exact same WebApplication
  # composition Program.cs uses (Program.BuildApp) on a real Kestrel listener
  # rather than the in-memory WebApplicationFactory TestServer every other
  # apps/api test uses — see
  # tests/Api.Tests/Contracts/ProblemDetailsProviderPactTests.cs for why.
  # Independent of pact-consumer (no `needs:`, same as every other job pair
  # in this file) — verifies against whatever pacts/*.json is currently
  # committed, regardless of run order.
  pact-provider-verify:
    name: "Contract: Pact provider verification (API)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore apps/api/Api.sln

      # The contract's one interaction ("the database is unreachable") needs
      # no Postgres/Testcontainers — its provider state is a connection
      # string that refuses instantly (see ProblemDetailsProviderPactTests.cs)
      # — so unlike api-tests above, this job doesn't depend on Docker.
      #
      # -p:CollectCoverage=false: coverlet's 100% threshold is a project
      # default (Api.Tests.csproj) measured against whatever subset of tests
      # actually ran — a --filter'd single-test run would otherwise fail on
      # "coverage below 100%" even though the contract verification itself
      # passed (confirmed locally: filtering without this flag hard-fails on
      # the threshold, not on the test). Full-suite coverage is already
      # api-tests' job above; this job's only concern is contract
      # conformance.
      - name: Verify provider contract (Pact)
        run: dotnet test apps/api/Api.sln -c Release --filter FullyQualifiedName~ProblemDetailsProviderPactTests -p:CollectCoverage=false

  # PR-only: this is the fast incremental check that runs on every PR push.
  # The full/complete score is enforced separately by the nightly job
  # (mutation-nightly.yml) which also refreshes the baseline this restores.
  mutation-pr:
    name: "Mutation testing (PR incremental)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Stryker incremental baseline (from nightly, main)
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/app/.stryker-tmp/incremental.json
            packages/i18n/.stryker-tmp/incremental.json
            packages/ui/.stryker-tmp/incremental.json
            packages/crypto/.stryker-tmp/incremental.json
            packages/diarization/.stryker-tmp/incremental.json
          # Deliberately unique per run so this primary key never hits —
          # every PR run falls through to restore-keys, which always
          # resolves to whatever the nightly job most recently published.
          key: stryker-incremental-pr-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-main-

      # stryker exits non-zero if the mutation score is below the `break`
      # threshold (90, see stryker.config.mjs) — that failure is this
      # step's own exit code, nothing extra to check.
      - name: Mutation testing (incremental, app)
        run: pnpm --filter app test:mutation:incremental

      - name: Mutation testing (incremental, i18n)
        run: pnpm --filter i18n test:mutation:incremental

      - name: Mutation testing (incremental, ui)
        run: pnpm --filter ui test:mutation:incremental

      - name: Mutation testing (incremental, crypto)
        run: pnpm --filter crypto test:mutation:incremental

      - name: Mutation testing (incremental, diarization)
        run: pnpm --filter diarization test:mutation:incremental

      - name: Save Stryker incremental cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            apps/app/.stryker-tmp/incremental.json
            packages/i18n/.stryker-tmp/incremental.json
            packages/ui/.stryker-tmp/incremental.json
            packages/crypto/.stryker-tmp/incremental.json
            packages/diarization/.stryker-tmp/incremental.json
          key: stryker-incremental-pr-${{ github.run_id }}

  sast:
    name: "SAST (CodeQL)"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

      # `analyze` (verified against its action.yml) has no severity-threshold
      # input and does not fail the step based on what it finds — it only
      # uploads SARIF to the Code Scanning UI. The usual way to make that
      # blocking is a *separate* branch-protection setting ("Require code
      # scanning results"), out of scope here. Since every gate in this file
      # must be able to fail for real on its own, query the Code Scanning
      # alerts API for this ref right after analysis (its default
      # wait-for-processing: true means alerts are already queryable) and
      # fail the job if any error/high/critical alert is open.
      - name: Fail on open CodeQL alerts (error/high/critical)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_count=$(gh api \
            "repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=${{ github.ref }}&per_page=100" \
            --jq '[.[] | select(.rule.security_severity_level == "critical" or .rule.security_severity_level == "high" or .rule.severity == "error")] | length')
          echo "Open error/high/critical CodeQL alerts for ${{ github.ref }}: $open_count"
          if [ "$open_count" -gt 0 ]; then
            echo "::error::$open_count open CodeQL alert(s) at error/high/critical severity for ${{ github.ref }}."
            exit 1
          fi

  # PR-only: dependency review diffs the dependency graph between the PR's
  # base and head ref, which is only meaningful for pull_request events.
  #
  # IMPORTANT — flagged, not silently worked around: this action's own docs
  # state it's available for "Public repositories" or "Private repositories
  # with a GitHub Advanced Security license" (github.com/actions/
  # dependency-review-action). This repo (morettto/limmiar) is private. If
  # GHAS isn't enabled on it, this job will error on every run regardless of
  # what a PR introduces — see final report.
  sca:
    name: "SCA (dependency review)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  secrets:
    name: "Secret scanning (gitleaks)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans git history by default; a shallow (depth-1)
          # checkout would only let it see the latest commit.
          fetch-depth: 0

      # Deliberately NOT zricethezav/gitleaks-action: that wrapper requires
      # a paid license for use on private repos/orgs (gitleaks' own docs).
      # gitleaks itself is OSS (MIT, gitleaks/gitleaks) and free regardless
      # of repo visibility, so install the official release binary directly
      # instead of the wrapper action.
      - name: Install gitleaks (OSS binary, v8.30.1)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # --redact avoids echoing real secret values into the (shared) CI log
      # if something is actually found; --exit-code 1 is gitleaks' default
      # on a detected leak but is spelled out for clarity.
      - name: Run gitleaks detect
        run: gitleaks detect --source . --redact --exit-code 1

  dast:
    name: "DAST (ZAP baseline)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter app build

      - name: Start preview server (background)
        run: |
          nohup pnpm --filter app exec vite preview --port 4173 --strictPort \
            > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid

      - name: Wait for preview server to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ >/dev/null 2>&1; then
              echo "Preview server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server did not respond within 30s" >&2
          cat /tmp/vite-preview.log || true
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:4173'
          # zaproxy/action-baseline's rules file only supports the "IGNORE"
          # action (see .zap/rules.tsv header comment for the source
          # reference) — it filters out alerts we've decided are out of
          # scope. Whatever WARN-or-above alert survives that filtering is
          # what fails the scan (zap-baseline.py's own default behavior);
          # deliberately not passing `-I` via cmd_options, since that would
          # suppress ALL warn-level failures and defeat the one rule (10021,
          # X-Content-Type-Options) this gate exists to enforce.
          rules_file_name: '.zap/rules.tsv'
          # This is what makes the job actually able to go red: without it,
          # the underlying zap-baseline.py exit code is swallowed and the
          # Action step reports success regardless.
          fail_action: true
          # Don't file/maintain a GitHub issue per scan — this gate's job is
          # to block the PR/build, not manage issues, and skipping it avoids
          # needing an `issues: write` grant on this job.
          allow_issue_writing: false

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
          fi

  # Runs on every push to main AND every PR (not gated to pull_request) —
  # explicitly required ("SBOM e coverage devem rodar em todo build").
  sbom:
    name: "SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter app build

      # NOT @cyclonedx/cyclonedx-npm: its own README requires "npm >= 9" and
      # shells out to the real npm CLI / an npm-format lockfile to walk the
      # dependency tree. This repo is pnpm-only (pnpm-lock.yaml, no
      # package-lock.json, no npm-compatible node_modules metadata), so that
      # tool would either error or silently produce an empty/wrong SBOM.
      # cdxgen (same CycloneDX org) has native pnpm-lock.yaml support, so it
      # runs from the repo root (where the lockfile lives — apps/app has no
      # lockfile of its own) and writes into apps/app/sbom.json as requested.
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.8.2 -o apps/app/sbom.json .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: apps/app/sbom.json
