name: Deploy API to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build + deploy apps/api
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore apps/api/Api.sln

      # Defense in depth, same pattern as deploy.yml (apps/app) running E2E
      # before deploy — a red test suite must never reach production.
      - name: Test
        run: dotnet test apps/api/Api.sln -c Release

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # --remote-only delegates the Docker build to Fly's remote builder
      # (always linux/amd64), so the Native AOT publish inside the Dockerfile
      # never depends on the runner's own architecture.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -c apps/api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
