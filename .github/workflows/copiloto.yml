name: Copiloto

on:
  pull_request:
    branches: [main]
    paths:
      - "mvp-copiloto/**"
      - ".github/workflows/copiloto.yml"
  push:
    branches: [main]
    paths:
      - "mvp-copiloto/**"
      - ".github/workflows/copiloto.yml"

jobs:
  testes-leves:
    name: "Testes leves (sem modelos)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mvp-copiloto
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Só o que estes testes importam. torch, sentence-transformers e ctranslate2 ficam de fora de propósito:
      # test_confiabilidade os carrega. Os testes trocam o juiz pequeno (onnxruntime) por um duplo; o tokenizador é real.
      - name: Install dependencies
        run: pip install fastapi httpx numpy pypdf python-multipart rank-bm25 "tokenizers>=0.23.1,<0.24" uvicorn

      - name: Unit tests
        run: |
          python -m unittest \
            scripts/test_acervo_profissional.py \
            scripts/test_api_produto.py \
            scripts/test_cascata.py \
            scripts/test_ciclo_juiz.py \
            scripts/test_citacoes.py \
            scripts/test_decisao.py \
            scripts/test_embedder.py \
            scripts/test_juiz_llm.py \
            scripts/test_juiz_pequeno.py \
            scripts/test_metadados.py \
            scripts/test_preparo_material.py \
            scripts/test_preparo_integracao.py \
            scripts/test_qualificacao.py \
            scripts/test_qualificacao5k.py \
            scripts/test_trecho.py \
            scripts/test_votos_api.py
