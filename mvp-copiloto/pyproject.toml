[project]
name = "mvp-copiloto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "numpy>=1.26",
    "onnxruntime>=1.30",
    "tokenizers>=0.23.1,<0.24",
    "huggingface_hub>=1.0",
    "httpx>=0.28",
    "fonttools>=4.50",
]

[project.optional-dependencies]
# Fora do serviço: copiloto.aluno, copiloto.traducao e as ferramentas de treino e de pesquisa em tools/atendimento-simulado.
pesquisa = [
    "sentence-transformers>=3.3",
    "peft>=0.21",
    "sentencepiece>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]
