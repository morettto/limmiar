[project]
name = "mvp-copiloto"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "sentence-transformers>=3.3",
    "numpy>=1.26",
    "httpx>=0.28",
    "rank_bm25>=0.2.2",
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "sacremoses>=0.1",
    "fonttools>=4.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copiloto"]
