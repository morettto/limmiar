# Orquestrador do copiloto no ambiente de teste (docs/ambiente-de-teste.md). Nome de app Fly é global: se estiver
# tomado, troque aqui e em docs/ambiente-de-teste.md. Memória não medida em contêiner: suba se o `fly logs` mostrar OOM.
app = "limmiar-copiloto-teste"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

# O acervo de cada conta vive na RAM do processo: parar a máquina por ociosidade apaga o acervo preparado.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "180s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/saude"
  protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
